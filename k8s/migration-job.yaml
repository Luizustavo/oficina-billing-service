apiVersion: batch/v1
kind: Job
metadata:
  name: oficina-billing-service-migrate
  namespace: billing
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: REPLACE_WITH_ECR_IMAGE_URI:latest
          command: ["npm", "run", "prisma:migrate:deploy"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          envFrom:
            - secretRef:
                name: oficina-billing-service-secret
