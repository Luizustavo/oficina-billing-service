apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oficina-billing-service
  namespace: billing
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api/billing
            pathType: Prefix
            backend:
              service:
                name: oficina-billing-service
                port:
                  number: 80
