# Modelo: copie para secret.yaml (ignorado pelo git) e preencha. Ver k8s/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-service-secret
  namespace: billing
type: Opaque
stringData:
  # Banco próprio do Billing no RDS; ?sslmode=no-verify pelo mesmo motivo do oficina-backend.
  DATABASE_URL: "postgresql://billing_user:password@rds-endpoint:5432/billing_db?sslmode=no-verify"
  # O mesmo JWT_SECRET do oficina-backend e da Lambda de CPF.
  JWT_SECRET: "same-secret-as-the-lambda"
  RABBITMQ_URL: "amqp://oficina:password@rabbitmq.messaging.svc.cluster.local:5672/oficina"
  NEW_RELIC_LICENSE_KEY: "your_new_relic_ingest_license_key"
